name: financialresume
description: A Flutter application for financial tracking.
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  image_picker: ^1.0.4
  permission_handler: ^11.0.0
  pdf: ^3.11.3
  open_file: ^3.3.2
  intl: ^0.17.0
  photo_view: ^0.15.0
  share_plus: ^10.0.0
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.5.4
  uuid: ^4.5.1
  camera: ^0.11.2
  google_sign_in: ^6.2.1
  printing: ^5.13.3
  google_generative_ai: ^0.4.0
  shared_preferences: ^2.3.2
  mailer: ^6.5.0
  google_fonts: ^6.2.1
  url_launcher: ^6.1.11



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_24pt-Regular.ttf
        - asset: assets/fonts/Inter_24pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700

  uses-material-design: true
  assets:
    - assets/images/

flutter_icons:
  android: true
  ios: true
  adaptive_icon_background: "#FFFFFF"